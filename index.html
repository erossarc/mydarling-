<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question 💖</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background Effects Container -->
    <div id="bg-effects"></div>
    <div id="cursor-trail"></div>

    <main class="main-container">
        <!-- Screen 1: Landing -->
        <section id="screen-landing" class="screen">
            <div class="glass-card landing-card">
                <h1>letter for you</h1>
                <div class="envelope-container" id="envelope-btn" style="cursor: pointer;">
                    <div class="envelope">
                        <div class="envelope-flap"></div>
                        <div class="envelope-pocket"></div>
                        <div class="heart-seal">❤️</div>
                    </div>
                </div>
                <p class="tap-hint">Tap the letter 💌</p>
            </div>
        </section>

        <!-- Screen 2: Love Letter -->
        <section id="screen-letter" class="screen hidden">
            <div class="glass-card letter-card">
                <div class="letter-content">
                    <div id="typing-text"></div>
                    <div id="letter-ending" class="hidden">
                        <p class="signature">Forever yours,</p>
                        <button id="continue-btn" class="btn primary-btn hidden">Open Your Question ✨</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Screen 3: Proposal -->
        <section id="screen-proposal" class="screen hidden">
            <div class="glass-card proposal-card">
                <h1 class="highlight-text">Will you be my darling for the rest of my life ?</h1>
                <div class="button-group">
                    <button id="yes-btn" class="btn primary-btn">
                        <span class="btn-icon">💖</span> YES
                    </button>
                    <button id="no-btn" class="btn secondary-btn">
                        <span class="btn-icon">🤍</span> NO
                    </button>
                </div>
            </div>
        </section>

        <!-- Screen 4: Celebration -->
        <section id="screen-celebration" class="screen hidden">
            <div class="glass-card celebration-card">
                <div class="handwriting heartbeat-loader huge-text">❤️</div>
                <p class="body-text">You just make my life</p>
                <h2 class="handwriting accent-text">You're my favorite chapter of life.</h2>
                <div class="our-story fade-in">
                    <p class="body-text">Thank you for making my heart feel at home.</p>
                    <div class="ribbon-banner">Our Story Begins 🌸</div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
